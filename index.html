<div class="container">
    <h2 class="mb-3">Part 1. Basic HTML Forms & HTML5 Validation</h2>
    <p class="text-muted">Task 0 & Task 1: Simple Contact Form with built-in HTML5 validation attributes.</p>

    <div class="card shadow-sm p-4 bg-white">
        <form action="#" method="GET">
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="name" name="name" required placeholder="Enter your full name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address:</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message:</label>
                <textarea class="form-control" id="message" name="message" rows="4" required maxlength="250" placeholder="Type your message here (max 250 chars)..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit Form</button>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
